[project]
name = "sos-my-interview-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # faster-whisper 1.2 passes an av.open() argument that PyAV 17+ removed.
    "av<17",
    "certifi>=2026.10.23",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "litellm>=1.110.2",
    "lxml>=6.1.3",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.30",
]
