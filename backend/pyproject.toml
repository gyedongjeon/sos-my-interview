[project]
name = "deep-dive-interview-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # faster-whisper 1.2 passes an av.open() argument that PyAV 17+ removed.
    "av<17",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "litellm>=1.110.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.30",
]
