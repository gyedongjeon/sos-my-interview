# Runs every test suite and build check when a pull request into main is opened.
# Later pushes to the pull request do not run it again, to keep runs few; start it by hand
# from the Actions tab ("Run workflow") when a re-run is wanted.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]
  workflow_dispatch:
  # Lets the release workflow run the same checks before it builds an installer.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest

  frontend:
    name: Frontend (vitest, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build

  desktop:
    name: Desktop (vitest, type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # Only the TypeScript sources are checked; the Electron binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
